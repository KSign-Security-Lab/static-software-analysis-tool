[project]
name = "static-software-analysis-tool"
version = "0.1.0"
description = "Static Software Analysis Tool (SSAT) - Python Monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ssat",
    "agent",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.uv]
package = false





[tool.uv.sources]
ssat = { workspace = true }
agent = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/ssat",
    "packages/agent",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
