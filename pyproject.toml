[project]
name = "static-software-analysis-tool"
version = "0.1.0"
description = "Static Software Analysis Tool (SSAT) - Python Monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ssat",
    "gnn",
    # With `rag`, because the semantic lookup is not optional to the agent that
    # has the tool: without the extra, `search_semantic` answers every question
    # with an error string, and the agent -- which cannot tell a missing
    # capability from an unhelpful one -- quietly falls back to `search_text`
    # and looks like it chose to. Nobody installs an extra to fix a tool they
    # were never told was broken.
    "agent[rag]",
    "graphify",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jpype1>=1.5.0",
]

[tool.uv]
package = false


[tool.uv.sources]
ssat = { workspace = true }
gnn = { workspace = true }
agent = { workspace = true }
graphify = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/ssat",
    "packages/gnn",
    "packages/agent",
    "packages/graphify",
    "packages/schemagen",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# So `uv run mypy` needs no arguments. packages/gnn is excluded: it is a
# consumer of the pipeline's output, not part of the analysis library, and is
# not held to the strict bar.
files = [
    "packages/ssat/src/ssat",
    "packages/agent/src/agent",
    "packages/graphify/src/graphify",
    "packages/schemagen/src/schemagen",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["packages/ssat/tests", "packages/agent/tests", "packages/graphify/tests", "packages/schemagen/tests"]
