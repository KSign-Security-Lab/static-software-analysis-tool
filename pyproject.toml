[project]
name = "static-software-analysis-tool"
version = "0.1.0"
description = "Static Software Analysis Tool (SSAT) - Python Monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ssat",
    "gnn",
    # `rag` is not optional: without it `search_semantic` returns an error
    # string and the agent falls back to `search_text` as though it chose to.
    "agent[rag]",
    "graphify",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "poethepoet>=0.32.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jpype1>=1.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
ssat = { workspace = true }
gnn = { workspace = true }
agent = { workspace = true }
graphify = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/ssat",
    "packages/gnn",
    "packages/agent",
    "packages/graphify",
    "packages/schemagen",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# So `uv run mypy` needs no arguments. packages/gnn is not held to the strict bar.
files = [
    "packages/ssat/src/ssat",
    "packages/agent/src/agent",
    "packages/graphify/src/graphify",
    "packages/schemagen/src/schemagen",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["packages/ssat/tests", "packages/agent/tests", "packages/graphify/tests", "packages/schemagen/tests"]

[tool.poe.tasks]

setup.help = "Install the Python workspace and the web dependencies"
setup.sequence = [
  { cmd = "uv sync" },
  { cmd = "pnpm install", cwd = "web" },
]

check.help = "Everything CI runs: lint, types, Python tests, then the web gate"
check.sequence = ["lint", { cmd = "mypy" }, "test", "web-check"]

lint.help = "ruff check plus a format check, no writes"
lint.sequence = [
  { cmd = "ruff check" },
  { cmd = "ruff format --check" },
]

fmt.help = "Format and autofix Python in place"
fmt.sequence = [
  { cmd = "ruff format ." },
  { cmd = "ruff check --fix ." },
]

test.help = "Python tests"
test.cmd = "pytest -q"

schema.help = "Regenerate the TypeScript wire models from the pydantic ones"
schema.sequence = [
  { cmd = "python -m agent.schema_ts --write" },
  { cmd = "python -m ssat.schema_ts --write" },
]

dev-api.help = "FastAPI on :8001, auto-reload scoped to the packages it imports"
dev-api.cmd = """
uvicorn api.main:app --host 0.0.0.0 --port 8001
  --reload --timeout-graceful-shutdown 2
  --reload-dir api --reload-dir packages/ssat/src/ssat
  --reload-dir packages/agent/src/agent --reload-dir packages/graphify/src/graphify
"""

dev-web.help = "Next.js dev server on :3000, with HMR"
dev-web.cmd = "pnpm dev"
dev-web.cwd = "web"

# No `--workers`: the SSE channels in api/agent/channels.py are a module-global
# dict, so a GET on /events would land on a worker that never saw the POST.
# `--timeout-graceful-shutdown` is not optional either -- without it, shutdown
# waits on an idle /events stream for the full start grace and looks like a hang.
prod-api.help = "FastAPI on :8001 as it runs for real: no reload, one process"
prod-api.cmd = "uvicorn api.main:app --host 0.0.0.0 --port 8001 --timeout-graceful-shutdown 2"

prod-web.help = "Build the web app, then serve the build on :3000"
prod-web.cwd = "web"
prod-web.shell = "pnpm build && pnpm start"

db.help = "Postgres, which the API does not start without"
db.cmd = "docker compose up -d --wait postgres"

# A shell task, not a `cmd` one: poe globs the tokens of a `cmd`, so the `*`
# that means "every profile" to Compose became a directory listing.
stack.help = "What is running right now, profiles included"
stack.shell = "docker compose --profile '*' ps -a"

web-check.help = "The web half of CI: types, lint, tests, licences, build"
web-check.cwd = "web"
web-check.shell = """
pnpm type-check && pnpm lint && pnpm test \
  && pnpm run licenses && pnpm run licenses:check && pnpm build
"""
