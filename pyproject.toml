[project]
name = "static-software-analysis-tool"
version = "0.1.0"
description = "Static Software Analysis Tool (SSAT) - Python Monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ssat",
    "gnn",
    "agent",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jpype1>=1.5.0",
]

[tool.uv]
package = false


[tool.uv.sources]
ssat = { workspace = true }
gnn = { workspace = true }
agent = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/ssat",
    "packages/gnn",
    "packages/agent",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# So `uv run mypy` needs no arguments. packages/gnn is excluded: it is a
# consumer of the pipeline's output, not part of the analysis library, and is
# not held to the strict bar.
files = ["packages/ssat/src/ssat", "packages/agent/src/agent", "api"]

[tool.pytest.ini_options]
testpaths = ["packages/ssat/tests", "packages/agent/tests"]

# ---------------------------------------------------------------------------
# Task index. This is the package.json "scripts" block for the parts of this
# repo that are not npm -- open it to see what can be run, the same way you
# would open package.json.
#
# Run one with `scripts/run.sh <name>`; run it bare to list them. Extra
# arguments are appended to the command. Comments directly above an entry are
# shown as its description in the listing, so the two cannot drift.
#
# Not a Makefile: that would mean installing make to run a CLI. Not uv, which
# has no task runner. `scripts/run.sh` is plain bash and parses this table.
# ---------------------------------------------------------------------------
[tool.tasks]
# Install the Python workspace and the web dependencies
setup = "uv sync && cd web && npm install"
# Everything CI runs: lint, format, types, Python tests, web checks
check = ".venv/bin/ruff check && .venv/bin/ruff format --check && .venv/bin/mypy && .venv/bin/python -m pytest -q && cd web && npm run --silent type-check && npm run --silent lint && npm run --silent test"
# Python tests
test = ".venv/bin/python -m pytest -q"
# ruff check plus a format check, no writes
lint = ".venv/bin/ruff check && .venv/bin/ruff format --check"
# Format and autofix Python in place
fmt = ".venv/bin/ruff format . && .venv/bin/ruff check --fix ."
# mypy --strict over the gated packages
types = ".venv/bin/mypy"
# Regenerate web/lib/agent-schema.ts from the pydantic wire models
schema = "cd packages/agent/src && PYTHONPATH=. ../../../.venv/bin/python -m agent.schema_ts --write"

# Start vLLM in Docker and wait until it answers
vllm = "docker compose --profile vllm up -d --wait vllm"
# Follow the vLLM log
vllm-logs = "docker compose --profile vllm logs -f vllm"
# Run an inspection (bare = interactive: endpoint, model, target)
agent = ".venv/bin/agent"
# Index a tree without calling a model; deterministic
index = ".venv/bin/agent index"
# Which model servers are reachable, and LangSmith status
endpoints = ".venv/bin/agent endpoints"
# Serve the MCP tool surface over stdio (needs AGENT_RUN_ROOT)
mcp = ".venv/bin/agent-mcp"

# FastAPI on :8000 with auto-reload
api = "scripts/dev-api.sh"
# Next.js dev server on :3000
web = "cd web && npm run dev"
# Production build of the web app
build = "cd web && npm run build"

# Start everything at once: vLLM, the API and the web UI, in one terminal
up = "scripts/up.sh"
# Stop vLLM only -- a bare `compose down` would also stop the Joern container
# that ssat's docker backend uses. Ctrl-C on `up` already stops the API and web.
down = "docker compose --profile vllm rm -sf vllm"

# End to end: start a server if needed, then inspect the sample tree
demo = "docker compose --profile vllm up -d --wait vllm && AGENT_MODEL=agent .venv/bin/agent inspect -v packages/agent/tests/fixtures/sample"
