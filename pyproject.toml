[project]
name = "static-software-analysis-tool"
version = "0.1.0"
description = "Static Software Analysis Tool (SSAT) - Python Monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ssat",
    "gnn",
    # With `rag`, because the semantic lookup is not optional to the agent that
    # has the tool: without the extra, `search_semantic` answers every question
    # with an error string, and the agent -- which cannot tell a missing
    # capability from an unhelpful one -- quietly falls back to `search_text`
    # and looks like it chose to. Nobody installs an extra to fix a tool they
    # were never told was broken.
    "agent[rag]",
    "graphify",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    # The task list at the bottom of this file. A dependency rather than a
    # shell script, so `uv sync` is the whole install.
    "poethepoet>=0.32.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jpype1>=1.5.0",
]

[tool.uv]
package = false


[tool.uv.sources]
ssat = { workspace = true }
gnn = { workspace = true }
agent = { workspace = true }
graphify = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/ssat",
    "packages/gnn",
    "packages/agent",
    "packages/graphify",
    "packages/schemagen",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# So `uv run mypy` needs no arguments. packages/gnn is excluded: it is a
# consumer of the pipeline's output, not part of the analysis library, and is
# not held to the strict bar.
files = [
    "packages/ssat/src/ssat",
    "packages/agent/src/agent",
    "packages/graphify/src/graphify",
    "packages/schemagen/src/schemagen",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["packages/ssat/tests", "packages/agent/tests", "packages/graphify/tests", "packages/schemagen/tests"]

# ---------------------------------------------------------------------------
# The task list, for the parts of this repo that are not npm and the parts that
# are. `uv run poe` prints it; `uv run poe <name>` runs one.
#
# Additive on purpose. Every entry below is the real command, and running it
# directly -- `ruff check`, `pnpm test` in web/, `docker compose ...` -- keeps
# working exactly as before. CI calls the tools rather than going through this,
# so nothing here can break a build by being wrong.
#
# Tasks that live in web/ set `cwd` rather than saying `cd web &&`: vitest and
# eslint resolve their config from the working directory, and running them from
# the repo root silently collects the wrong files.
# ---------------------------------------------------------------------------
[tool.poe.tasks]

setup.help = "Install the Python workspace and the web dependencies"
setup.sequence = [
  { cmd = "uv sync" },
  { cmd = "pnpm install", cwd = "web" },
]

check.help = "Everything CI runs: lint, types, Python tests, then the web gate"
check.sequence = ["lint", "types", "test", "web-check"]

test.help = "Python tests"
test.cmd = "pytest -q"

lint.help = "ruff check plus a format check, no writes"
lint.sequence = [
  { cmd = "ruff check" },
  { cmd = "ruff format --check" },
]

fmt.help = "Format and autofix Python in place"
fmt.sequence = [
  { cmd = "ruff format ." },
  { cmd = "ruff check --fix ." },
]

types.help = "mypy --strict over the gated packages"
types.cmd = "mypy"

schema.help = "Regenerate the TypeScript wire models from the pydantic ones"
schema.sequence = [
  { cmd = "python -m agent.schema_ts --write" },
  { cmd = "python -m ssat.schema_ts --write" },
]

# -- the web app -------------------------------------------------------------

web.help = "Next.js dev server on :3000"
web.cmd = "pnpm dev"
web.cwd = "web"

build.help = "Production build of the web app"
build.cmd = "pnpm build"
build.cwd = "web"

web-check.help = "The web half of CI: types, lint, tests, licences, build"
web-check.cwd = "web"
web-check.shell = """
pnpm type-check && pnpm lint && pnpm test \
  && pnpm run licenses && pnpm run licenses:check && pnpm build
"""

# -- the API and the containers ----------------------------------------------

api.help = "FastAPI on :8001 with auto-reload scoped to the packages it imports"
api.cmd = """
uvicorn api.main:app --host 0.0.0.0 --port 8001
  --reload --timeout-graceful-shutdown 2
  --reload-dir api --reload-dir packages/ssat/src/ssat
  --reload-dir packages/agent/src/agent --reload-dir packages/graphify/src/graphify
"""

db.help = "Postgres, which the API does not start without"
db.cmd = "docker compose up -d --wait postgres"

vllm.help = "The model server, on :8000 (profile-gated, ~20GB image)"
vllm.cmd = "docker compose --profile vllm up -d --wait vllm"

# A shell task, not a `cmd` one: poe globs the tokens of a `cmd`, and the `*`
# that means "every profile" to Compose became a directory listing.
stack.help = "What is running right now, profiles included"
stack.shell = "docker compose --profile '*' ps -a"

# -- the agent ---------------------------------------------------------------

agent.help = "Run an inspection (bare = interactive: endpoint, model, target)"
agent.cmd = "agent"

corpus.help = "Embed corpus/ into Postgres so search_corpus has something to answer with"
corpus.cmd = "agent corpus ingest"

endpoints.help = "Which model servers are reachable, and what they serve"
endpoints.cmd = "agent endpoints"

sweep.help = "The unattended SEC-bench sweep (start it in tmux)"
sweep.cmd = "agent bench sweep"
