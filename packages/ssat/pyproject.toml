[project]
name = "ssat"
version = "2.4.3"
description = "Static Software Analysis Tool (SSAT) - Unified Package"
readme = "README.md"
authors = [{ name = "Keon Oh Kim", email = "keonoh00@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "schemagen",
    "pydantic>=2.12.3",
    "tqdm>=4.66.0",
]

[project.scripts]
# One command with subcommands: ssat {cpg,template,ast,template-functions,dfg,full,f2a}.
#
# There used to be 24 entries here, including bare `test`, `lint`, `format` and
# `docker-up`, which shadowed common command names in the venv's bin directory
# and just shelled out to ruff/mypy/pytest/npm. Run those tools directly.
ssat = "ssat.cli.__main__:ssat_main"

[project.optional-dependencies]
# pytest-asyncio, deepdiff and jsonschema were declared but never imported by
# any test; the pipeline has no async entry points left either.
test = ["pytest>=7.0.0"]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
schemagen = { workspace = true }
