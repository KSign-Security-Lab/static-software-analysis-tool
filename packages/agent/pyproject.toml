[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Keon Oh Kim", email = "keonoh00@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "deepdiff>=8.6.1",
    "rich>=14.2.0",
    "torch>=2.9.0",
    "torch-geometric>=2.7.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.12.3",
]

[project.scripts]
agent = "agent:main"
train = "agent:train"
evaluate = "agent:evaluate"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
