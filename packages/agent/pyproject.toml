[project]
name = "agent"
version = "0.1.0"
description = "GNN training and evaluation over SSAT-extracted AST/DFG graphs"
readme = "README.md"
authors = [{ name = "Keon Oh Kim", email = "keonoh00@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "deepdiff>=8.6.1",
    "rich>=14.2.0",
    "torch>=2.9.0",
    "torch-geometric>=2.7.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.12.3",
    "numpy>=1.26",
    "tqdm>=4.66.0",
    # scripts/data_analysis.py: parquet-backed graph statistics
    "polars>=1.0",
    "pyarrow>=15.0",
]

[project.scripts]
# `train` and `evaluate` used to be installed under those bare names, shadowing
# anything else on PATH. They are subcommands of `agent` now.
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
