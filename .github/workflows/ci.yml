name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy --strict
        run: uv run mypy

      # Covers the F2-A suite, the golden characterization snapshots, the
      # GNN training-data contract, the CPG backend equivalence checks, and the
      # agent package (index, schema, locate, tools, graph, API).
      # Tests needing Joern, the container, or bubblewrap skip cleanly, and no
      # test calls a model -- the inspection loop is driven by a scripted one.
      - name: pytest
        run: uv run pytest -q

  web:
    name: Web (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run test
