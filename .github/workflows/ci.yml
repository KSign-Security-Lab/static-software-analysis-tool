name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy --strict
        run: uv run mypy

      # Covers the F2-A suite, the golden characterization snapshots, the
      # GNN training-data contract, the CPG backend equivalence checks, and the
      # agent package (index, schema, locate, tools, graph, API).
      # Tests needing Joern, the container, or bubblewrap skip cleanly, and no
      # test calls a model -- the inspection loop is driven by a scripted one.
      - name: pytest
        run: uv run pytest -q

  web:
    name: Web (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One source of truth for CI, dev and Docker. Node 20 went
          # end-of-life in April 2026, and vite 8 (under vitest) already wants
          # ^20.19 || >=22.12 -- latest-20.x satisfied that with no headroom.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run test

      # Every dependency is permissively licensed, or has a reviewed exception
      # with a written reason. Runs before the build so a bad dependency fails
      # fast rather than after a full compile.
      - run: npm run licenses

      - run: npm run licenses:check

      # tsc --noEmit does not catch a server component importing a client-only
      # module, or a broken dynamic() boundary. Only a real build does.
      - run: npm run build
