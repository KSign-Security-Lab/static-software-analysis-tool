[project]
name = "cli"
version = "2.4.3"
description = "Static Software Analysis Tool CLI"
readme = "README.md"
authors = [{ name = "Keon Oh Kim", email = "keonoh00@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "core",
    "tqdm>=4.66.0",
]

[project.scripts]
ssat = "cli.__main__:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }


